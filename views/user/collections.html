<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bộ sưu tập | RosetteCloset</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/public/css/user/collections.css" />
  <link rel="stylesheet" href="/public/css/layouts/navbar.css" />
  <link rel="stylesheet" href="/public/css/layouts/footer.css" />
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main class="page-container">
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <ol>
        <li><a href="/">Trang chủ</a></li>
        <li>
          <span class="material-symbols-outlined">chevron_right</span>
          <span id="collections-breadcrumb-current">Bộ sưu tập</span>
        </li>
      </ol>
    </nav>

    <section class="page-heading">
      <h1 id="collections-heading-title">Khám Phá Bộ Sưu Tập</h1>
      <p id="collections-heading-description">Những thiết kế tinh tuyển cho khoảnh khắc toả sáng của bạn. Tận hưởng sự sang trọng và đẳng cấp trong từng đường nét cắt may.</p>
    </section>

    <section class="filter-bar" aria-label="Bộ lọc và sắp xếp">
      <div class="filter-group">
        <button class="current" type="button" data-filter-status="all">Tất cả</button>
        <button type="button" data-filter-status="available">Sẵn sàng</button>
      </div>

      <div class="sort-group">
        <span>Sắp xếp:</span>
        <select id="collections-sort" aria-label="Sắp xếp sản phẩm">
          <option value="-createdAt">Mới nhất</option>
          <option value="rentalPrice">Giá thấp - cao</option>
          <option value="-rentalPrice">Giá cao - thấp</option>
        </select>
      </div>
    </section>

    <section class="product-grid" id="collections-grid" aria-label="Danh sách sản phẩm">
      <p class="collections-empty"></p>
    </section>

    <nav class="pagination" aria-label="Phân trang">
      <button id="collections-prev" type="button" aria-label="Trang trước"><span class="material-symbols-outlined">chevron_left</span></button>
      <div id="collections-pages">
        <button class="current" type="button">1</button>
      </div>
      <button id="collections-next" type="button" aria-label="Trang sau"><span class="material-symbols-outlined">chevron_right</span></button>
    </nav>
  </main>

  <div id="footer-placeholder"></div>
  <script src="/public/js/layouts/navbar.js"></script>
  <script src="/public/js/user/collections.js"></script>
</body>
</html>
