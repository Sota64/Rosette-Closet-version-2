<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thông tin tài khoản | RosetteCloset</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/public/css/layouts/navbar.css" />
  <link rel="stylesheet" href="/public/css/layouts/footer.css" />
  <link rel="stylesheet" href="/public/css/user/account.css" />
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main class="account-page">
    <div class="container">
      <nav class="account-breadcrumbs" aria-label="Breadcrumb">
        <a href="/views/user/homepage.html">Trang chủ</a>
        <span class="material-symbols-outlined">chevron_right</span>
        <span>Thông tin tài khoản</span>
      </nav>

      <section class="account-shell">
        <div class="account-heading">
          <p>Tài khoản</p>
          <h1>Thông tin cá nhân</h1>
        </div>

        <form class="account-card" id="account-form">
          <label>
            Họ và tên
            <input type="text" name="fullName" id="account-full-name" required />
          </label>

          <label>
            Email
            <input type="email" name="email" id="account-email" readonly />
          </label>

          <label>
            Số điện thoại
            <input type="tel" name="phone" id="account-phone" />
          </label>

          <label>
            Tỉnh / Thành phố
            <select id="account-province" required>
              <option value="">Chọn tỉnh / thành phố</option>
            </select>
          </label>

          <label>
            Quận / Huyện
            <select id="account-district" required disabled>
              <option value="">Chọn quận / huyện</option>
            </select>
          </label>

          <label>
            Phường / Xã
            <select id="account-ward" required disabled>
              <option value="">Chọn phường / xã</option>
            </select>
          </label>

          <label>
            Số nhà, tên đường
            <input type="text" id="account-street" placeholder="Ví dụ: 123 Đường Cầu Giấy" required />
          </label>

          <div class="account-actions">
            <p id="account-message" role="status"></p>
            <button type="submit">Lưu thay đổi</button>
          </div>
        </form>
      </section>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="/public/js/layouts/navbar.js"></script>
  <script src="/public/js/user/account.js"></script>
</body>
</html>
