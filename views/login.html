<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập | RosetteCloset</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/public/css/login.css" />
</head>
<body>
  <div class="hero-background" aria-hidden="true">
    <div class="hero-overlay"></div>
    <img
      src="/public/images/anhbialogin.jpeg"
    />
  </div>

  <main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand-block">
        <a href="/views/homepage.html"><h1 id="login-title">Rosette Closet</h1></a>
        <p>Chào mừng bạn quay trở lại với sự sang trọng.</p>
      </div>

      <form class="login-form" action="#" method="post">
        <div class="form-group">
          <label for="email">ĐỊA CHỈ EMAIL</label>
          <input id="email" name="email" type="email" placeholder="yourname@luxury.com" />
        </div>

        <div class="form-group">
          <div class="field-header">
            <label for="password">MẬT KHẨU</label>
          </div>

          <div class="password-field">
            <input id="password" name="password" type="password" placeholder="••••••••" />
            <button class="icon-button" type="button" aria-label="Hiện mật khẩu">
              <span class="material-symbols-outlined">visibility</span>
            </button>
          </div>
        </div>

        <button class="submit-button" type="submit">
          <span>ĐĂNG NHẬP</span>
          <span class="material-symbols-outlined">arrow_forward</span>
        </button>
      </form>

      <div class="divider">
        <span>HOẶC TIẾP TỤC VỚI</span>
      </div>

      <div class="social-grid">
        <button class="social-button" type="button">
          <span class="material-symbols-outlined">public</span>
          Google
        </button>
      </div>

      <p class="signup-text">
        Chưa có tài khoản?
        <a href="./signUp.html">Đăng ký ngay</a>
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 RosetteCloset.</p>
    <nav aria-label="Liên kết chân trang">
      <a href="#">Tính bền vững</a>
      <a href="#">Liên hệ</a>
      <a href="#">Điều khoản dịch vụ</a>
    </nav>
  </footer>
  <script src="/public/js/apiClient.js"></script>
  <script>
    const loginForm = document.querySelector(".login-form");
    const togglePasswordButton = document.querySelector(".password-field .icon-button");

    function showToast(message) {
      let container = document.getElementById("toast-container");
      if (!container) {
        container = document.createElement("div");
        container.id = "toast-container";
        container.style.cssText = `
          position: fixed;
          top: 24px;
          right: 24px;
          z-index: 9999;
          display: flex;
          flex-direction: column;
          gap: 12px;
        `;
        document.body.appendChild(container);
      }

      const toast = document.createElement("div");
      toast.style.cssText = `
        min-width: 260px;
        max-width: 360px;
        border-left: 4px solid #ba1a1a;
        border-radius: 8px;
        background: rgba(31, 27, 19, 0.95);
        color: #ffffff;
        padding: 14px 18px;
        font-family: 'Be Vietnam Pro', sans-serif;
        font-size: 14px;
        font-weight: 500;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
        transform: translateY(-16px);
        opacity: 0;
        transition: all 0.25s ease;
      `;
      toast.textContent = message;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.style.transform = "translateY(0)";
        toast.style.opacity = "1";
      });

      setTimeout(() => {
        toast.style.transform = "translateY(-16px)";
        toast.style.opacity = "0";
        setTimeout(() => toast.remove(), 250);
      }, 3000);
    }

    togglePasswordButton.addEventListener("click", () => {
      const passwordInput = document.getElementById("password");
      const icon = togglePasswordButton.querySelector(".material-symbols-outlined");
      const shouldShowPassword = passwordInput.type === "password";

      passwordInput.type = shouldShowPassword ? "text" : "password";
      icon.textContent = shouldShowPassword ? "visibility_off" : "visibility";
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const submitButton = loginForm.querySelector(".submit-button");
      const submitText = submitButton.querySelector("span");
      submitButton.disabled = true;
      submitText.textContent = "ĐANG ĐĂNG NHẬP...";

      const payload = {
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      };

      try {
        const response = await apiFetch("/api/auth/login", {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.message || "Đăng nhập thất bại");
        }

        const role = result.data.user.role;
        const redirectUrl = new URLSearchParams(window.location.search).get("redirect");
        window.location.href = redirectUrl || (role === "admin" ? "/views/admin/dashboard.html" : "/views/user/homepage.html");
      } catch (error) {
        showToast(error.message);
      } finally {
        submitButton.disabled = false;
        submitText.textContent = "ĐĂNG NHẬP";
      }
    });
  </script>
  <script src="/public/js/layouts/navbar.js"></script>
</body>
</html>
