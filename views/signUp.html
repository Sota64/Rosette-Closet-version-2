<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RosetteCloset - Đăng Ký Thành Viên</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/public/css/signUp.css" />
</head>
<body>
  <main class="signup-page">
    <div class="signup-layout">
      <div class="decor decor-top"></div>
      <div class="decor decor-bottom"></div>

      <section class="signup-card" aria-labelledby="signup-title">
        <div class="brand-block">
          <h1 id="signup-title">Rosette Closet</h1>
          <p>Gia nhập cộng đồng thượng lưu</p>
        </div>

        <form class="signup-form" action="#" method="post">
          <div class="form-group">
            <label for="full-name">Họ và Tên</label>
            <div class="input-wrapper">
              <input id="full-name" name="full-name" type="text" placeholder="Nguyễn Văn A" required />
              <span class="material-symbols-outlined">person</span>
            </div>
          </div>

          <div class="form-group">
            <label for="email">Địa chỉ Email</label>
            <div class="input-wrapper">
              <input id="email" name="email" type="email" placeholder="example@rosette.vn" required />
              <span class="material-symbols-outlined">mail</span>
            </div>
          </div>

          <div class="form-group">
            <label for="phone">Số Điện Thoại</label>
            <div class="input-wrapper">
              <input id="phone" name="phone" type="tel" placeholder="+84 000 000 000" required />
              <span class="material-symbols-outlined">call</span>
            </div>
          </div>

          <div class="form-group">
            <label for="address">Địa chỉ</label>
            <div class="input-wrapper">
              <input id="address" name="address" type="text" placeholder="Địa chỉ nhận váy" required />
              <span class="material-symbols-outlined">home</span>
            </div>
          </div>

          <div class="form-group">
            <label for="password">Mật Khẩu</label>
            <div class="input-wrapper">
              <input id="password" name="password" type="password" placeholder="••••••••" required />
              <span class="material-symbols-outlined">lock</span>
            </div>
          </div>

          <div class="terms-row">
            <input id="terms" name="terms" type="checkbox" required />
            <label for="terms">
              Tôi đồng ý với <a href="#">Điều khoản Dịch vụ</a> và
              <a href="#">Chính sách Bảo mật</a> của RosetteCloset.
            </label>
          </div>

          <button class="submit-button" type="submit">Tạo Tài Khoản</button>
        </form>

        <div class="signin-link">
          <p>
            Bạn đã có tài khoản?
            <a href="login.html">Đăng nhập ngay</a>
          </p>
        </div>
      </section>

      <aside class="side-image-card" aria-label="Luxury Fashion Registration">
        <div class="image-card">
          <img
            src="/public/images/biasignup.jpg"
          />
          <div class="image-overlay"></div>
          <div class="image-caption">
            <p class="caption-title">Đặc quyền dành riêng cho bạn.</p>
            <p class="caption-text">Khám phá bộ sưu tập giới hạn từ những nhà mốt hàng đầu thế giới.</p>
          </div>
        </div>
      </aside>
    </div>
  </main>
  <script src="/public/js/apiClient.js"></script>
  <script>
    const signupForm = document.querySelector(".signup-form");

    function showToast(message) {
      let container = document.getElementById("toast-container");
      if (!container) {
        container = document.createElement("div");
        container.id = "toast-container";
        container.style.cssText = `
          position: fixed;
          top: 24px;
          right: 24px;
          z-index: 9999;
          display: flex;
          flex-direction: column;
          gap: 12px;
        `;
        document.body.appendChild(container);
      }

      const toast = document.createElement("div");
      toast.style.cssText = `
        min-width: 260px;
        max-width: 360px;
        border-left: 4px solid #ba1a1a;
        border-radius: 8px;
        background: rgba(31, 27, 19, 0.95);
        color: #ffffff;
        padding: 14px 18px;
        font-family: 'Be Vietnam Pro', sans-serif;
        font-size: 14px;
        font-weight: 500;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
        transform: translateY(-16px);
        opacity: 0;
        transition: all 0.25s ease;
      `;
      toast.textContent = message;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.style.transform = "translateY(0)";
        toast.style.opacity = "1";
      });

      setTimeout(() => {
        toast.style.transform = "translateY(-16px)";
        toast.style.opacity = "0";
        setTimeout(() => toast.remove(), 250);
      }, 3000);
    }

    signupForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const submitButton = signupForm.querySelector(".submit-button");
      submitButton.disabled = true;
      submitButton.textContent = "Đang tạo tài khoản...";

      const payload = {
        fullName: document.getElementById("full-name").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        address: document.getElementById("address").value.trim(),
        password: document.getElementById("password").value
      };

      try {
        const response = await apiFetch("/api/auth/register", {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.message || "Đăng ký thất bại");
        }

        window.location.href = "/views/user/homepage.html";
      } catch (error) {
        showToast(error.message);
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Tạo Tài Khoản";
      }
    });
  </script>
  <script src="/public/js/layouts/navbar.js"></script>
</body>
</html>
